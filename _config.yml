# Book settings
title: "Advanced Machine Learning"
author: "Course Instructor"

# Execution settings
execute:
  execute_notebooks: "off"  # Crucial for Netlify to skip heavy ML training during build

html:
  use_repository_button: true
  use_issues_button: true

sphinx:
  config:
    # This activates the built-in Sphinx extension for Reveal.js slides
    extensions:
      - sphinx_revealjs

# 1. Provide the exact path to your public GitHub repo
repository:
  url: https://github.com/yanhai-xiong/DATA301-AML
  path_to_book: ""  # Leave blank if your book is in the root directory
  branch: main      # Or "master" depending on your default branch

# 2. Activate the Google Colab launch button
launch_buttons:
  colab_url: "https://colab.research.google.com"
