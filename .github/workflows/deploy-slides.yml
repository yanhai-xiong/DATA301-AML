name: Build and deploy notebook slides

on:
  push:
    branches:
      - main

  # Allows deployment to be started manually from the Actions page.
  workflow_dispatch:

# Only one Pages deployment should run at a time.
concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install notebook converter
        run: python -m pip install nbconvert

      - name: Build Reveal presentations
        run: python build_slides.py
        env:
          SITE_BASE: /DATA301-AML

      - name: Disable Jekyll processing
        run: touch public/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload generated site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
