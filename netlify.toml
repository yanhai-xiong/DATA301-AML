[build]
  # Commands to install dependencies and compile the Jupyter Book into HTML
  command = "pip install -r requirements.txt && jupyter-book build ."
  
  # The directory containing the compiled static HTML pages Netlify needs to host
  publish = "_build/html"

[build.environment]
  # Configures Python 3 inside the Netlify build container
  PYTHON_VERSION = "3.10"

[[redirects]]
  # Ensures user-refreshed paths route properly within the book structure
  from = "/*"
  to = "/index.html"
  status = 200
